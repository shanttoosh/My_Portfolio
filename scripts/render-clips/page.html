<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>render-clips</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      html, body { margin: 0; background: #090909; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <canvas id="out" width="1600" height="900"></canvas>
    <script type="module">
      // Loaded by render.mjs as page.html?clip=<name>[&guides]. Exposes window.renderFrame(i).
      // Fonts: Inter + JetBrains Mono from Google Fonts. If they cannot be loaded the kit's font stacks fall
      // back to Segoe UI / Consolas and window.fontStatus reports which faces are missing.
      import { W, H } from './lib/kit.js'
      const q = new URLSearchParams(location.search)
      const name = q.get('clip')
      const guides = q.has('guides')

      async function loadFonts() {
        if (document.readyState !== 'complete') await new Promise((r) => window.addEventListener('load', r, { once: true }))
        const faces = [
          ['Inter', 400], ['Inter', 500], ['Inter', 600],
          ['JetBrains Mono', 400], ['JetBrains Mono', 500],
        ]
        const sample = 'Ag09[]{}=>()$.:/'
        const timeout = new Promise((r) => setTimeout(() => r(null), 20000))
        const loaded = await Promise.race([
          Promise.all(faces.map(([f, w, st = '']) => document.fonts.load(`${st} ${w} 24px "${f}"`.trim(), sample).catch(() => []))),
          timeout,
        ])
        await document.fonts.ready
        return faces.map(([f, w, st = ''], i) => ({
          face: `${f} ${w}${st ? ' ' + st : ''}`,
          ok: !!loaded && loaded[i].length > 0 && loaded[i].every((ff) => ff.status === 'loaded') &&
            document.fonts.check(`${st} ${w} 24px "${f}"`.trim(), sample),
        }))
      }

      try {
        window.fontStatus = await loadFonts()
        const mod = await import(`./clips/${name}.js`)
        const canvas = document.getElementById('out')
        // willReadFrequently keeps the canvas on the CPU rasteriser: deterministic pixels, no GPU needed.
        const ctx = canvas.getContext('2d', { willReadFrequently: true, alpha: false })
        const clip = mod.create(ctx)
        window.renderFrame = (i) => {
          ctx.save()
          ctx.setTransform(1, 0, 0, 1, 0, 0)
          ctx.globalAlpha = 1
          ctx.fillStyle = '#000'
          ctx.fillRect(0, 0, W, H)
          clip.render(i, ctx)
          ctx.restore()
          if (guides) {
            // 4:3 phone crop (central 1200 x 900) - preview only.
            ctx.save()
            ctx.strokeStyle = 'rgba(255,80,160,0.7)'
            ctx.setLineDash([8, 8])
            ctx.lineWidth = 1
            ctx.strokeRect(200.5, 0.5, 1199, 899)
            ctx.restore()
          }
        }
        window.clipReady = true
      } catch (e) {
        window.clipError = String((e && e.stack) || e)
      }
    </script>
  </body>
</html>
